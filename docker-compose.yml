version: "3.9"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: family-budget-app
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/supervisord.conf:/etc/supervisor/conf.d/supervisord.conf:ro
      - ./docker/entrypoint.sh:/usr/local/bin/entrypoint.sh:ro
    environment:
      - APP_ENV=${APP_ENV:-production}
      - APP_DEBUG=${APP_DEBUG:-false}
      - DB_HOST=${DB_HOST:-db}
      - DB_PORT=${DB_PORT:-3306}
      - DB_DATABASE=${DB_DATABASE:-family-budget-pro}
      - DB_USERNAME=${DB_USERNAME:-fbp_user}
      - DB_PASSWORD=${DB_PASSWORD:-fb_password}
    command: ["/bin/bash", "-c", "/usr/local/bin/entrypoint.sh"]
    # env_file:
    #   - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "8080:80"

  db:
    image: mysql:8.0
    container_name: family-budget-db
    restart: always
    environment:
      MYSQL_HOST: ${DB_HOST:-db}
      MYSQL_PORT: ${DB_PORT:-3306}
      MYSQL_DATABASE: ${DB_DATABASE:-family-budget-pro}
      MYSQL_USER: ${DB_USERNAME:-fbp_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-fb_password}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_password}
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/mysql/db-entrypoint.sh:/docker-entrypoint-initdb.d/db-entrypoint.sh:ro
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30

  phpmyadmin:
    image: phpmyadmin:5.2
    container_name: family-budget-phpmyadmin
    restart: always
    ports:
      - "8081:80"
    environment:
      PMA_HOST: ${DB_HOST:-db}
      PMA_USER: ${DB_ROOT_USER:-root}
      PMA_PASSWORD: ${DB_ROOT_PASSWORD:-root_password}
    depends_on:
      - db
      - redis

  redis:
    image: redis:7-alpine
    container_name: family-budget-redis
    restart: always
    ports:
      - "6379:6379"

volumes:
  db_data:

